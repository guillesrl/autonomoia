# ============================================================
# Autonomo IA — Nginx config
# Path en servidor:  /etc/nginx/sites-available/guillers.es
# Symlink:           ln -s /etc/nginx/sites-available/guillers.es /etc/nginx/sites-enabled/
# Recargar:          nginx -t && systemctl reload nginx
# ============================================================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name guillers.es www.guillers.es;

    # Permite el challenge HTTP-01 de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://guillers.es$request_uri;
    }
}

# --- www → apex redirect (HTTPS) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.guillers.es;

    ssl_certificate     /etc/letsencrypt/live/guillers.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guillers.es/privkey.pem;

    return 301 https://guillers.es$request_uri;
}

# --- Sitio principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guillers.es;

    root /var/www/guillers.es/dist;
    index index.html;

    # ----- SSL -----
    ssl_certificate     /etc/letsencrypt/live/guillers.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guillers.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP relajada: permite fuentes de Google + inline JSON-LD. Endurece si no usas inline styles.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ----- Compression -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml application/ld+json
        image/svg+xml font/woff2;

    # Si tienes el módulo brotli compilado, descomenta:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/ld+json;

    # ----- Cache estático con hash (Vite usa hash en el filename) -----
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ----- Imágenes y SVG -----
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ----- Archivos especiales sin cache agresivo -----
    location = /robots.txt    { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml   { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location = /llms.txt      { expires 1d; add_header Cache-Control "public, max-age=86400"; default_type text/plain; charset utf-8; }

    # ----- HTML siempre fresco -----
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ----- SPA fallback (anchor links + futuras rutas) -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Bloquear dotfiles -----
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----- Logs -----
    access_log /var/log/nginx/guillers.es.access.log;
    error_log  /var/log/nginx/guillers.es.error.log warn;
}
