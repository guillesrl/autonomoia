<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="blob1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0960AE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0960AE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3E8FD8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3E8FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="55%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#03325E" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#03325E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64A6E3"/>
      <stop offset="50%" stop-color="#8FBFEC"/>
      <stop offset="100%" stop-color="#B8D1E7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#080F1C"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>
  <rect width="1200" height="630" fill="url(#blob3)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="44" height="44" rx="12" fill="rgba(255,255,255,0.12)"/>
    <path d="M11 33 L22 11 L33 33 M14.5 24.5 H29.5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="58" y="32" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">Autonomo<tspan fill="#8FBFEC">IA</tspan></text>
  </g>

  <!-- Title -->
  <text x="80" y="290" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="76" font-weight="800" fill="white" letter-spacing="-2.8">Duplica tus clientes</text>
  <text x="80" y="380" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2.8">sin trabajar más horas</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.65)">Asistentes IA por WhatsApp que responden, califican</text>
  <text x="80" y="486" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.65)">y agendan citas 24/7. Configuración en 48 horas.</text>

  <!-- Pills -->
  <g transform="translate(80, 540)">
    <rect width="180" height="48" rx="24" fill="#0960AE"/>
    <text x="90" y="31" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="16" font-weight="600" fill="white">Auditoría gratis →</text>
  </g>
  <text x="290" y="571" font-family="DM Mono, monospace" font-size="15" fill="rgba(255,255,255,0.55)">guillers.es · +376 615 808</text>
